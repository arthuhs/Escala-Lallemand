<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Escala Lallemand - Soft Dark</title>
    <style>
        :root {
            /* Fundo Soft Dark (Estilo Discord/GitHub) */
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-soft: #9e9e9e;
            
            /* Trabalho: Neutro e elegante */
            --color-work: #252525; 
            --border-work: #333333;
            --text-work: #e0e0e0;
            
            /* Folga: Verde musgo suave */
            --color-off: #1b3320;  
            --color-off-text: #81c784; 
            --border-off: #24422a;
            
            /* Feriado Trabalho: Roxo profundo */
            --color-holiday-work: #2d203b; 
            --color-holiday-work-text: #b39ddb;
            --border-holiday-work: #3b2b4d;
            
            /* Feriado Folga: Dourado envelhecido */
            --color-holiday-off: #362f13; 
            --color-holiday-off-text: #ffd54f;
            --border-holiday-off: #4a401a;
            
            --accent: #64b5f6; /* Azul suave para detalhes */
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px 10px;
            color: var(--text-main);
        }

        .calendar-container { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 18px; 
            width: 100%;
            max-width: 340px; 
            box-sizing: border-box; 
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
        }

        .header h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-main); margin: 0; }

        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }

        .day { 
            width: 100%; 
            aspect-ratio: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 10px; 
            font-weight: 600; 
            font-size: 0.95rem;
            transition: transform 0.1s;
            box-sizing: border-box;
        }

        .day:active { transform: scale(0.92); }

        .weekday { font-size: 0.7rem; color: var(--text-soft); border: none; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Aplicação das Cores Soft Dark */
        .work { background-color: var(--color-work); color: var(--text-work); border: 1px solid var(--border-work); }
        .off { background-color: var(--color-off); color: var(--color-off-text); border: 1px solid var(--border-off); }
        .holiday-work { background-color: var(--color-holiday-work); color: var(--color-holiday-work-text); border: 1px solid var(--border-holiday-work); }
        .holiday-off { background-color: var(--color-holiday-off); color: var(--color-holiday-off-text); border: 1px solid var(--border-holiday-off); }
        
        .empty { border: none; }

        .legend-container { 
            margin-top: 20px; 
            width: 100%;
            max-width: 340px; 
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .legend-item { 
            background: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 0.7rem; 
            font-weight: 600;
            color: var(--text-soft);
        }

        .box { width: 14px; height: 14px; border-radius: 4px; }

        .holiday-list-container { 
            margin-top: 20px; 
            width: 100%;
            max-width: 340px; 
            background: var(--card-bg); 
            padding: 15px; 
            border-radius: 16px; 
            box-sizing: border-box;
        }

        .holiday-list-container h4 { margin: 0 0 12px 0; font-size: 0.8rem; color: var(--text-soft); text-transform: uppercase; letter-spacing: 1px; }
        .holiday-item { font-size: 0.85rem; padding: 10px 0; border-bottom: 1px solid var(--border-work); display: flex; align-items: center; gap: 10px; }
        .holiday-item:last-child { border-bottom: none; }
        .holiday-date { font-weight: bold; color: var(--bg-color); background: var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }

        button { 
            cursor: pointer; 
            width: 36px;
            height: 36px;
            border: none; 
            background: var(--color-work); 
            color: var(--accent); 
            border-radius: 50%; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <h2 style="font-size: 1.3rem; margin-bottom: 20px; font-weight: 600; letter-spacing: 0.5px;">Escala Lallemand</h2>

    <div class="calendar-container">
        <div class="header">
            <button onclick="changeMonth(-1)">❮</button>
            <h3 id="monthTitle">Maio 2026</h3>
            <button onclick="changeMonth(1)">❯</button>
        </div>

        <div class="grid" id="calendarGrid">
            <div class="day weekday">Dom</div>
            <div class="day weekday">Seg</div>
            <div class="day weekday">Ter</div>
            <div class="day weekday">Qua</div>
            <div class="day weekday">Qui</div>
            <div class="day weekday">Sex</div>
            <div class="day weekday">Sáb</div>
        </div>
    </div>

    <div class="legend-container">
        <div class="legend-item"><div class="box work"></div> Trabalho</div>
        <div class="legend-item"><div class="box off"></div> Folga</div>
        <div class="legend-item"><div class="box holiday-work"></div> Feriado (Trab)</div>
        <div class="legend-item"><div class="box holiday-off"></div> Feriado (Folga)</div>
    </div>

    <div class="holiday-list-container" id="holidayListSection">
        <h4>Feriados do Mês</h4>
        <div id="holidayListContent"></div>
    </div>

    <script>
        // Data base: 09 de Maio de 2026 (Trabalho)
        const startDate = new Date(2026, 4, 9); 
        let currentDisplayDate = new Date(2026, 4, 1);

        const feriados = {
            "01-01": "Confraternização Universal",
            "02-17": "Carnaval",
            "04-03": "Paixão de Cristo",
            "04-21": "Tiradentes",
            "05-01": "Dia do Trabalhador",
            "05-24": "Aniversário de Patos",
            "06-04": "Corpus Christi",
            "06-13": "Santo Antônio (Padroeiro)",
            "09-07": "Independência do Brasil",
            "10-12": "Nossa Senhora Aparecida",
            "11-02": "Finados",
            "11-15": "Proclamação da República",
            "11-20": "Consciência Negra",
            "12-25": "Natal"
        };

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const monthTitle = document.getElementById('monthTitle');
            const holidayListSection = document.getElementById('holidayListSection');
            const holidayListContent = document.getElementById('holidayListContent');
            
            const days = grid.querySelectorAll('.day:not(.weekday)');
            days.forEach(d => d.remove());
            holidayListContent.innerHTML = "";

            const year = currentDisplayDate.getFullYear();
            const month = currentDisplayDate.getMonth();
            
            const rawDateString = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(currentDisplayDate);
            monthTitle.innerText = rawDateString.charAt(0).toUpperCase() + rawDateString.slice(1);

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let hasHolidaysThisMonth = false;

            for (let i = 0; i < firstDayOfMonth; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.classList.add('day', 'empty');
                grid.appendChild(emptyDiv);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('day');
                dayDiv.innerText = day;

                const diffTime = date.getTime() - startDate.getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const cyclePos = ((diffDays % 6) + 6) % 6;

                const key = String(month + 1).padStart(2, '0') + "-" + String(day).padStart(2, '0');
                const nomeFeriado = feriados[key];

                if (cyclePos >= 0 && cyclePos <= 2) {
                    if (nomeFeriado) {
                        dayDiv.classList.add('holiday-work');
                        dayDiv.onclick = () => alert(`Feriado: ${nomeFeriado}\nEscala: Trabalho`);
                        addHolidayToList(day, nomeFeriado);
                        hasHolidaysThisMonth = true;
                    } else {
                        dayDiv.classList.add('work');
                    }
                } else {
                    if (nomeFeriado) {
                        dayDiv.classList.add('holiday-off');
                        dayDiv.onclick = () => alert(`Feriado: ${nomeFeriado}\nEscala: Folga`);
                        addHolidayToList(day, nomeFeriado);
                        hasHolidaysThisMonth = true;
                    } else {
                        dayDiv.classList.add('off');
                    }
                }

                grid.appendChild(dayDiv);
            }

            holidayListSection.style.display = hasHolidaysThisMonth ? "block" : "none";
        }

        function addHolidayToList(day, name) {
            const holidayListContent = document.getElementById('holidayListContent');
            const item = document.createElement('div');
            item.classList.add('holiday-item');
            item.innerHTML = `<span class="holiday-date">${String(day).padStart(2, '0')}/${String(currentDisplayDate.getMonth() + 1).padStart(2, '0')}</span> <span>${name}</span>`;
            holidayListContent.appendChild(item);
        }

        function changeMonth(offset) {
            currentDisplayDate.setMonth(currentDisplayDate.getMonth() + offset);
            renderCalendar();
        }

        renderCalendar();
    </script>
</body>
</html>
